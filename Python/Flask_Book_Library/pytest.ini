[pytest]
testpaths = tests
pythonpath = .
# -ra              : summary with the full name (incl. parameters) of every
#                    non-passing test
# --tb=line        : one line per failure with its reason (e.g. DID NOT RAISE)
#                    instead of a full traceback - keeps the build log readable
# --show-capture=no: the model prints every object it creates; with 10M-char
#                    inputs that would flood the log on failure
# no:cacheprovider : do not leave a .pytest_cache directory in the image
addopts = -ra --tb=line --show-capture=no -p no:cacheprovider
